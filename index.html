<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>เว็บไซต์แรกของฉัน</title>
    <style>
        /* ส่วนตกแต่งหน้าตาเว็บไซต์ด้วย CSS */
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 0;
            background-color: #f4f7f6;
            color: #333;
            text-align: center;
        }

        header {
            background-color: #4CAF50;
            color: white;
            padding: 40px 20px;
        }

        h1 {
            margin: 0;
            font-size: 2.5rem;
        }

        p {
            font-size: 1.2rem;
        }

        .container {
            padding: 40px 20px;
        }

        .btn {
            display: inline-block;
            background-color: #333;
            color: white;
            padding: 10px 20px;
            text-decoration: none;
            border-radius: 5px;
            margin-top: 20px;
            transition: background 0.3s;
        }

        .btn:hover {
            background-color: #555;
        }

        footer {
            background-color: #222;
            color: white;
            padding: 15px;
            position: fixed;
            bottom: 0;
            width: 100%;
        }
    </style>
</head>
<body>

    <!-- ส่วนหัวข้อเว็บไซต์ -->
    <header>
        <h1>ยินดีต้อนรับสู่เว็บไซต์ของฉัน</h1>
        <p>นี่คือเว็บเพจแรกที่สร้างด้วย HTML และ CSS เบื้องต้น</p>
    </header>

    <!-- ส่วนเนื้อหาหลัก -->
    <div class="container">
        <h2>เกี่ยวกับฉัน</h2>
        <p>ฉันกำลังเริ่มต้นเรียนรู้การเขียนโปรแกรมและการพัฒนาเว็บไซต์</p>
        
        <a href="https://www.youtube.com/watch?v=ggqdIh7sZqg" target="_blank" class="btn">ไปที่ youtube</a>
    </div>

    <!-- ส่วนท้ายเว็บไซต์ -->
    <footer>
        <p>&copy; 2026 สร้างโดย ปิยะชัย กล้วยนอก</p>
    </footer>

</body>
</html>
